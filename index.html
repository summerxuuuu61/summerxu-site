<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="徐琦然 Summer Xu 的个人作品网站，纪实摄影、新闻摄影与视频剪辑。">
  <meta name="theme-color" content="#0a0a0a">
  <title>Summer Xu · 徐琦然 — 个人作品</title>

  <link rel="stylesheet" href="css/fonts.css?v=97">
  <link rel="icon" href="favicon.svg?v=97" type="image/svg+xml">

  <link rel="stylesheet" href="css/style.css?v=97">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="site-header">
    <nav class="wrap nav" aria-label="主导航">
      <a class="brand" href="#/" aria-label="回到首页">
        <span class="brand__en">Summer Xu</span>
        <span class="brand__zh">徐琦然</span>
      </a>

      <button class="nav__toggle" id="menuToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <div class="nav__right">
        <button class="theme-toggle" id="themeToggle" aria-label="切换深浅主题" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 12.8A8.5 8.5 0 1 1 11 3.5a7 7 0 0 0 10 9.3Z"></path>
          </svg>
        </button>
        <button class="lang-toggle" id="langToggle" aria-label="切换语言" title="中 / EN">中 / EN</button>
        <div class="nav__links">
          <a href="#/" data-nav="home" data-i18n-site="nav.home">首页</a>
          <a href="#/photography" data-nav="photography" data-i18n-site="nav.photo">摄影作品</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- 主体内容（由 JS 渲染） -->
  <main id="app"></main>

  <!-- 沉浸式全屏画廊 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <header class="lightbox__head">
      <span class="lightbox__title" id="lbTitle"></span>
      <button class="lightbox__close" id="lbClose" aria-label="关闭">✕</button>
    </header>
    <img class="lightbox__img" id="lbImg" src="" alt="">
    <button class="lightbox__nav prev" data-lb="prev" aria-label="上一张">‹</button>
    <button class="lightbox__nav next" data-lb="next" aria-label="下一张">›</button>
    <footer class="lightbox__foot" id="lbFoot"></footer>
  </div>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div class="footer-col">
        <span class="footer-col__title">Contact &amp; Channels</span>
        <span class="footer-col__line" id="footerContact">—</span>
      </div>
      <div class="footer-col">
        <span class="footer-col__title">Sections</span>
        <div class="footer-links">
          <a href="#/" data-i18n-site="nav.home">首页</a>
          <a href="#/photography" data-i18n-site="nav.photo">摄影作品</a>
        </div>
      </div>
      <div class="footer-col footer-col__end">
        <span class="name">Summer Xu · 徐琦然</span>
        <span class="muted">© <span id="year"></span> All Rights Reserved.</span>
        <button class="back-top" id="backTop">Back to top ↑</button>
      </div>
    </div>
  </footer>

  <!-- 数据 + 逻辑 -->
  <script src="data/portfolio-data.js?v=97"></script>
  <script src="data/tones.js?v=97"></script>
  <script src="data/categories.js?v=97"></script>
  <script src="data/hashes.js?v=97"></script>
  <script src="data/sizes.js?v=97"></script>
  <script src="data/places.js?v=97"></script>
  <script src="data/borders.js?v=97"></script>
  <script src="data/admin1.js?v=97"></script>
  <script src="js/three.min.js?v=97"></script>
  <script src="js/vendor/Pass.js?v=97"></script>
  <script src="js/vendor/MaskPass.js?v=97"></script>
  <script src="js/vendor/CopyShader.js?v=97"></script>
  <script src="js/vendor/LuminosityHighPassShader.js?v=97"></script>
  <script src="js/vendor/ShaderPass.js?v=97"></script>
  <script src="js/vendor/EffectComposer.js?v=97"></script>
  <script src="js/vendor/RenderPass.js?v=97"></script>
  <script src="js/vendor/UnrealBloomPass.js?v=97"></script>
  <script src="js/vendor/GLTFLoader.js?v=97"></script>
  <script src="js/vendor/STLLoader.js?v=97"></script>
  <script src="js/models.js?v=97"></script>
  <script src="js/globe.js?v=97"></script>
  <script src="js/lockers.js?v=97"></script>
  <script src="js/room-media.js?v=97"></script>
  <script src="js/room.js?v=97"></script>
  <script src="js/main.js?v=97"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("footerContact").textContent = window.PORTFOLIO.person.contact;
  </script>
  <script>
    window.LANG = window.LANG || "zh";
    window.__SITE_I18N = {
      zh: { "nav.home":"首页", "nav.photo":"摄影作品", "nav.about":"关于我" },
      en: { "nav.home":"Home", "nav.photo":"Photography", "nav.about":"About Me" }
    };
    function applySiteLang(){
      document.querySelectorAll("[data-i18n-site]").forEach(function(el){ var k=el.getAttribute("data-i18n-site"); var v=(window.__SITE_I18N[window.LANG]||{})[k]; if(v) el.textContent=v; });
      var f=document.getElementById("aboutFrame"); if(f) f.src="resume-landing.html?lang="+window.LANG;
    }
    var lt=document.getElementById("langToggle"); if(lt) lt.addEventListener("click", function(){ window.LANG = window.LANG==="zh"?"en":"zh"; applySiteLang(); if(window.__applyLang) window.__applyLang(); });
    applySiteLang();
  </script>
</body>
</html>
